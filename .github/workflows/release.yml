# Builds installers for all three platforms natively. Cross-compiling a GUI app is
# more trouble than it is worth, so each target builds on its own runner.
name: release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxkbcommon-dev libgl1-mesa-dev
      - name: Tests
        # GUI tests drive the egui tree headlessly; no display needed
        run: cargo test --workspace --release
      - name: Formatting and lints
        run: |
          cargo fmt --check || echo "::warning::cargo fmt would reformat"
          cargo clippy --workspace --release -- -D warnings || echo "::warning::clippy findings"

  macos:
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - name: Build universal .app and .dmg
        run: ./packaging/macos.sh
        env:
          # Set these repository secrets to ship a signed, notarised build.
          IDENTITY: ${{ secrets.MACOS_IDENTITY }}
          NOTARY_PROFILE: ${{ secrets.MACOS_NOTARY_PROFILE }}
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*.dmg

  windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - name: Install NSIS
        run: choco install nsis -y --no-progress
      - name: Build .exe and installer
        shell: pwsh
        run: ./packaging/windows.ps1
        env:
          SIGN_PFX: ${{ secrets.WINDOWS_PFX_PATH }}
          SIGN_PFX_PASSWORD: ${{ secrets.WINDOWS_PFX_PASSWORD }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*-setup.exe

  linux:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: System libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libgtk-3-dev libxcb-render0-dev libxcb-shape0-dev \
            libxcb-xfixes0-dev libxkbcommon-dev libssl-dev libgl1-mesa-dev
      - name: appimagetool
        run: |
          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          sudo mv appimagetool-x86_64.AppImage /usr/local/bin/appimagetool
      - name: Build .deb and AppImage
        run: ./packaging/linux.sh
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.deb
            dist/*.AppImage

  publish:
    needs: [macos, windows, linux]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: artifacts }
      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
